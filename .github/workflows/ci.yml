name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Python tests
        run: python -m pytest -q
      - name: Security audit
        run: python scripts/security_audit.py
      - name: Performance smoke
        run: python scripts/perf_benchmark.py --iterations 50
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go tests and vet
        run: cd go && go test ./... && go vet ./...
      - name: Go gateway build
        run: cd go && go build ./cmd/skif-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node SDK smoke test
        run: node ./node/test.js
